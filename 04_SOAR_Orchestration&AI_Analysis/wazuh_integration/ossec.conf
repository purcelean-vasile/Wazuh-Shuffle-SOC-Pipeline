        <name>shuffle</name>
        <hook_url>http://<shuffle_ip>:3001/api/v1/hooks/webhook_cfb9b72e-795d-4d88-8b4f-9a7006183cec</hook_url>
        <rule_id>100021</rule_id>
        <alert_format>json</alert_format>
      </integration>

<!-- =============== Workflow 2: Suspicious File Detected ============== -->
